<!DOCTYPE html>
<!--
    ゴルフスコア一覧出力画面 (export.html)
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>スコア一覧出力</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    background: #f3f6f4; color: #17352a;
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 520px; height: 100vh; height: 100dvh;
    margin: auto; background: #fff;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    flex-shrink: 0; background: #087a50; color: white; padding: 10px 14px;
    box-shadow: 0 2px 6px #0002;
  }
  header .top { 
    display: flex; align-items: center; justify-content: space-between; 
  }
  header h1 { margin: 0; font-size: 18px; font-weight: bold; }

  .nav-link {
    color: white; background: rgba(255, 255, 255, 0.2);
    text-decoration: none; font-size: 14px; font-weight: 700;
    padding: 6px 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.5);
  }

  .content {
    flex: 1; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  }

  .date-bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    color: #586c63; font-size: 13px; font-weight: bold;
  }
  .date-bar select { min-width: 0; flex: 1; height: 38px; padding: 0 8px; border: 1px solid #d8e5df; border-radius: 6px; background: #fff; color: #17352a; }
  .date-manage { color: #087a50; font-size: 13px; white-space: nowrap; }

  .info-card {
    flex-shrink: 0;
    background: #f0f7f4; border: 1px solid #dce8e3; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; color: #3a4a43; line-height: 1.4;
  }
  .info-card strong { color: #087a50; }

  .action-buttons {
    display: flex; gap: 8px; flex-shrink: 0;
  }

  .btn {
    flex: 1; padding: 10px 8px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: opacity 0.15s, transform 0.05s;
  }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: #087a50; color: #fff;
    box-shadow: 0 2px 6px rgba(8, 122, 80, 0.3);
  }

  .btn-secondary {
    background: #e7f4ef; color: #087a50;
    border: 1.5px solid #087a50;
  }

  .output-area {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    position: relative;
  }

  textarea {
    flex: 1; width: 100%; height: 100%;
    background: #fafcfb; border: 1.5px solid #dce8e3; border-radius: 8px;
    padding: 10px 12px;
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 14px; line-height: 1.6; color: #17352a;
    resize: none; box-sizing: border-box; white-space: pre;
    tab-size: 4; -moz-tab-size: 4;
  }
  textarea:focus {
    outline: none; border-color: #087a50;
  }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(23, 53, 42, 0.92); color: #fff;
    padding: 10px 22px; border-radius: 20px; font-size: 14px; font-weight: bold;
    pointer-events: none; opacity: 0; transition: opacity 0.25s ease-in-out;
    z-index: 1000; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; }

  @media (min-width: 700px) {
    body { padding: 12px; }
    .app { height: calc(100vh - 24px); border-radius: 14px; box-shadow: 0 8px 35px #0001; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="top">
      <h1>スコア一覧出力</h1>
      <a href="summary.html" class="nav-link">‹ 一覧</a>
    </div>
  </header>

  <main class="content">
    <div class="date-bar">
      <label for="dateSelect">プレー日</label>
      <select id="dateSelect" aria-label="プレー日"></select>
      <a class="date-manage" href="dates.html">日付管理</a>
    </div>
    <div class="info-card">
      <div id="roundInfo"></div>
      PC取り込み用（タブ区切りテキスト）です。<strong>「コピー」</strong>を押してExcelやスプレッドシート、メールなどにそのまま貼り付けできます。
    </div>

    <div class="action-buttons">
      <button id="copyBtn" class="btn btn-primary">📋 コピーする</button>
      <button id="downloadBtn" class="btn btn-secondary">💾 ファイル保存 (.tsv)</button>
    </div>

    <div class="output-area">
      <textarea id="tsvOutput" readonly placeholder="登録されたスコアデータがありません"></textarea>
    </div>
  </main>
</div>

<div id="toast" class="toast">コピーしました！</div>

<script src="golf_data.js"></script>
<script>
const MAX_SHOTS = 12;

function createEmptyHoleData() {
  return Array.from({ length: MAX_SHOTS }, () => ({ club: "－", rating: "－" }));
}

let data = Array.from({ length: 18 }, () => createEmptyHoleData());

function loadData() {
  const round = GolfData.getRound();
  const parsed = round?.data;
  if (!Array.isArray(parsed) || parsed.length !== 18) return;
  data = parsed.map(holeShots => {
    const filled = createEmptyHoleData();
    holeShots.slice(0, MAX_SHOTS).forEach((shot, i) => {
      filled[i] = {
        club: shot.club || "－",
        rating: shot.rating || "－",
        bunker: shot.bunker === true,
        ...(shot.location ? { location: shot.location } : {})
      };
    });
    return filled;
  });
}

function generateTsv() {
  loadData();
  const lines = [];

  data.forEach((holeShots, holeIndex) => {
    const holeNum = holeIndex + 1;
    let shotNum = 0;

    holeShots.forEach(shot => {
      const hasClub = shot.club && shot.club !== "" && shot.club !== "－";
      const hasRating = shot.rating && shot.rating !== "" && shot.rating !== "－";

      if (hasClub || hasRating) {
        shotNum++;
        const club = hasClub ? `${shot.club}${shot.bunker ? "-B" : ""}` : "";
        const rating = hasRating ? shot.rating : "";
        const latitude = shot.location?.latitude ?? "";
        const longitude = shot.location?.longitude ?? "";
        lines.push(`${holeNum}\t${shotNum}\t${club}\t${rating}\t${latitude}\t${longitude}`);
      }
    });
  });

  return lines.join("\n");
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
  }, 2000);
}

function copyToClipboard(text) {
  if (!text) {
    showToast("出力データがありません");
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showToast("クリップボードにコピーしました！");
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.getElementById("tsvOutput");
  textarea.select();
  try {
    document.execCommand("copy");
    showToast("クリップボードにコピーしました！");
  } catch (e) {
    showToast("コピーに失敗しました。直接全選択してコピーしてください。");
  }
}

function downloadTsv(content) {
  if (!content) {
    showToast("出力データがありません");
    return;
  }
  const blob = new Blob([content], { type: "text/tab-separated-values;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const courseName = GolfData.getRound()?.courseName || "";
  const safeCourseName = courseName.replace(/[\\/:*?"<>|]/g, "_").trim();
  a.download = `golf_score_${GolfData.getSelectedDate()}${safeCourseName ? `_${safeCourseName}` : ""}.tsv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("TSVファイルをダウンロードしました");
}

const textarea = document.getElementById("tsvOutput");

function renderDateSelect() {
  const selectedDate = GolfData.getSelectedDate();
  const select = document.getElementById("dateSelect");
  select.innerHTML = GolfData.getRounds().map(round =>
    `<option value="${round.date}">${round.date}${round.courseName ? ` - ${GolfData.escapeHtml(round.courseName)}` : ""}</option>`
  ).join("");
  select.value = selectedDate;
  const courseName = GolfData.getRound(selectedDate)?.courseName || "ゴルフ場名未設定";
  document.getElementById("roundInfo").textContent = `${selectedDate} / ${courseName}`;
  textarea.value = generateTsv();
}

document.getElementById("dateSelect").onchange = event => {
  GolfData.setSelectedDate(event.target.value);
  renderDateSelect();
};

GolfData.ready.then(renderDateSelect);

// タップ時に全選択
textarea.onclick = () => {
  if (textarea.value) textarea.select();
};

document.getElementById("copyBtn").onclick = () => {
  copyToClipboard(textarea.value);
};

document.getElementById("downloadBtn").onclick = () => {
  downloadTsv(textarea.value);
};

// ピンチズーム制御
document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('gesturestart', (e) => {
  e.preventDefault();
});
</script>
</body>
</html>
