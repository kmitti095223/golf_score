<!DOCTYPE html>
<!--
    ゴルフスコア一覧画面 (summary.html)
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>スコア一覧</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    overflow: hidden; /* スクロールなし */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    background: #f3f6f4; color: #17352a;
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
  }
  
  .app {
    max-width: 520px; height: 100vh; height: 100dvh;
    margin: auto; background: #fff;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    flex-shrink: 0; background: #087a50; color: white; padding: 10px 14px;
    box-shadow: 0 2px 6px #0002;
  }
  header .top { 
    display: flex; align-items: center; justify-content: space-between; 
  }
  header h1 { margin: 0; font-size: 18px; font-weight: bold; }

  .header-actions {
    display: flex; align-items: center; gap: 6px;
  }

  .nav-link {
    color: white; background: rgba(255, 255, 255, 0.2);
    text-decoration: none; font-size: 13px; font-weight: 700;
    padding: 5px 9px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.5);
  }

  .btn-reset {
    color: #ff3b30; background: #ffffff;
    border: none; font-size: 12px; font-weight: 700;
    padding: 5px 8px; border-radius: 16px; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }

  .par-label { color: #586c63; font-size: 10px; font-weight: normal; }
  .hole-link { color: inherit; text-decoration: none; }
  .hole-link:hover { text-decoration: underline; }

  .content {
    flex: 1; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  }

  /* 上部トータルサマリー */
  .summary-card {
    flex-shrink: 0; background: #f0f7f4; border-radius: 8px; padding: 6px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    text-align: center; border: 1px solid #dce8e3;
  }
  .summary-card small { font-size: 12px; color: #586c63; font-weight: bold; display: block; }
  .summary-card strong { font-size: 22px; color: #087a50; font-weight: 800; line-height: 1.1; }

  /* 2列並びのメインテーブルエリア */
  .tables-container {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 100%; overflow: hidden;
  }

  .column-box {
    display: flex; flex-direction: column; height: 100%;
  }

  .score-table {
    width: 100%; height: 100%; border-collapse: collapse; background: #fff;
    border: 1px solid #dce8e3; font-size: 14px; table-layout: fixed;
  }
  .score-table th, .score-table td {
    padding: 2px 2px; text-align: center; border-bottom: 1px solid #edf4f1; vertical-align: middle;
  }
  .score-table th {
    background: #f5f9f7; font-size: 11px; color: #3a4a43; font-weight: bold; height: 24px;
  }

  /* 幅調整 */
  .col-hole { width: 17%; font-weight: bold; font-size: 13px; }
  .col-score{ width: 26%; font-weight: 800; color: #087a50; font-size: 15px; }
  .score-mark { font-size: 19px; font-weight: 900; }
  .score-under { color: #d32f2f; }
  .col-ratings {
    width: 57%; text-align: left !important; padding-left: 3px !important;
    letter-spacing: 0.5px; color: #17352a; font-weight: bold; font-size: 12px;
    white-space: normal; word-break: break-all; line-height: 1.15;
  }
  .rating-great {
    color: #0066cc;
    font-weight: 900;
    -webkit-text-stroke: 0.6px #0066cc;
    display: inline-block;
  }
  .rating-bad {
    color: #d32f2f;
    font-weight: 900;
    -webkit-text-stroke: 0.6px #d32f2f;
    display: inline-block;
  }

  .putt-count { font-size: 12px; color: #586c63; font-weight: normal; margin-left: 1px; }

  .total-row {
    background: #f0f7f4; font-weight: 800; color: #087a50; min-height: 28px; font-size: 15px;
  }
  .total-ratings {
    font-size: 10.5px !important;
    font-weight: bold;
    color: #17352a;
    line-height: 1.2;
    padding: 2px 2px !important;
    letter-spacing: -0.2px;
    text-align: left !important;
  }

  @media (min-width: 700px) {
    body { padding: 12px; }
    .app { height: calc(100vh - 24px); border-radius: 14px; box-shadow: 0 8px 35px #0001; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="top">
      <h1>スコア一覧</h1>
      <div class="header-actions">
        <a href="golf_score.html" class="nav-link">‹ 入力</a>
        <a href="par_settings.html" class="nav-link">Par設定</a>
        <a href="export.html" class="nav-link">出力 ❯</a>
        <button id="clearDataBtn" class="btn-reset">全クリア</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="summary-card">
      <div><small>OUT</small><strong id="outScore">0</strong></div>
      <div><small>IN</small><strong id="inScore">0</strong></div>
      <div><small>TOTAL</small><strong id="totalScore">0</strong></div>
    </div>

    <div class="tables-container">
      <!-- OUT 1〜9H -->
      <div class="column-box">
        <table class="score-table">
          <thead>
            <tr>
              <th style="width:17%;">Hole</th>
              <th style="width:26%;">スコア(P)</th>
              <th style="width:57%;">良否</th>
            </tr>
          </thead>
          <tbody id="outBody"></tbody>
        </table>
      </div>

      <!-- IN 10〜18H -->
      <div class="column-box">
        <table class="score-table">
          <thead>
            <tr>
              <th style="width:17%;">Hole</th>
              <th style="width:26%;">スコア(P)</th>
              <th style="width:57%;">良否</th>
            </tr>
          </thead>
          <tbody id="inBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const MAX_SHOTS = 12;

function createEmptyHoleData() {
  return Array.from({ length: MAX_SHOTS }, () => ({ club: "－", rating: "－" }));
}

let data = Array.from({ length: 18 }, () => createEmptyHoleData());
let pars = Array.from({ length: 18 }, () => 4);

function loadData() {
  const saved = localStorage.getItem("golfScoreDemo");
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length === 18) {
        data = parsed.map(holeShots => {
          const filled = createEmptyHoleData();
          holeShots.slice(0, MAX_SHOTS).forEach((shot, i) => {
            filled[i] = { club: shot.club || "－", rating: shot.rating || "－" };
          });
          return filled;
        });
      }
    } catch(e) {}
  } else {
    data = Array.from({ length: 18 }, () => createEmptyHoleData());
  }
}

function loadPars() {
  const saved = localStorage.getItem("golfParSettings");
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length === 18) {
        pars = parsed.map(value => {
          const par = Number(value);
          return Number.isInteger(par) && par >= 3 && par <= 6 ? par : 4;
        });
      }
    } catch(e) {}
  }
}

function isShotEntered(shot) {
  return (shot.club !== "" && shot.club !== "－") || (shot.rating !== "" && shot.rating !== "－");
}

function getEnteredShots(shots) {
  return shots.filter(isShotEntered);
}

function getHoleScore(shots) {
  return getEnteredShots(shots).length;
}

function getPuttScore(shots) {
  return shots.filter(shot => shot.club === "PT").length;
}

function getScoreMark(score, par) {
  if (score === 0) return "-";
  const difference = score - par;
  if (difference <= -1) return '<span class="score-mark score-under">○</span>';
  if (difference === 0) return '<span class="score-mark">ー</span>';
  if (difference === 1) return '<span class="score-mark">△</span>';
  if (difference === 2) return '<span class="score-mark">□</span>';
  return `<span class="score-mark">+${difference}</span>`;
}

function getRatingSymbols(shots) {
  const entered = getEnteredShots(shots);
  if (entered.length === 0) return "-";
  const symbols = entered.map(s => {
    const r = (s.rating && s.rating !== "－") ? s.rating : "・";
    if (r === "◎") return '<strong class="rating-great">◎</strong>';
    if (r === "×") return '<strong class="rating-bad">×</strong>';
    return r;
  });
  const chunks = [];
  for (let i = 0; i < symbols.length; i += 6) {
    chunks.push(symbols.slice(i, i + 6).join(""));
  }
  return chunks.join("<br>");
}

function renderSummary() {
  loadData();
  loadPars();
  const holeScores = data.map(getHoleScore);
  const puttScores = data.map(getPuttScore);

  const outScore = holeScores.slice(0, 9).reduce((a, b) => a + b, 0);
  const inScore = holeScores.slice(9, 18).reduce((a, b) => a + b, 0);
  const totalScore = outScore + inScore;

  const outPutts = puttScores.slice(0, 9).reduce((a, b) => a + b, 0);
  const inPutts = puttScores.slice(9, 18).reduce((a, b) => a + b, 0);

  document.getElementById("outScore").textContent = `${outScore} (${outPutts})`;
  document.getElementById("inScore").textContent = `${inScore} (${inPutts})`;
  document.getElementById("totalScore").textContent = `${totalScore} (${outPutts + inPutts})`;

  renderTableSection("outBody", 0, 9, outScore, outPutts);
  renderTableSection("inBody", 9, 18, inScore, inPutts);
}

function renderTableSection(containerId, startIdx, endIdx, sectionTotalScore, sectionTotalPutts) {
  const container = document.getElementById(containerId);

  let rowsHtml = "";
  let sectionGreat = 0; // ◎
  let sectionGood = 0;  // ○
  let sectionFair = 0;  // △
  let sectionBad = 0;   // ×

  for (let i = startIdx; i < endIdx; i++) {
    const holeNum = i + 1;
    const shots = data[i];
    const score = getHoleScore(shots);
    const putts = getPuttScore(shots);
    const scoreMark = getScoreMark(score, pars[i]);
    const scoreDisplay = score > 0
      ? `${score}${putts > 0 ? ` (${putts})` : ""} ${scoreMark}`
      : "-";
    const ratingsStr = getRatingSymbols(shots);

    shots.forEach(shot => {
      if (shot.rating === "◎") sectionGreat++;
      else if (shot.rating === "○") sectionGood++;
      else if (shot.rating === "△") sectionFair++;
      else if (shot.rating === "×") sectionBad++;
    });

    rowsHtml += `
      <tr>
        <td class="col-hole"><a class="hole-link" href="golf_score.html?hole=${holeNum}">${holeNum}H<br><span class="par-label">Par ${pars[i]}</span></a></td>
        <td class="col-score">
          ${scoreDisplay}
        </td>
        <td class="col-ratings">${ratingsStr}</td>
      </tr>
    `;
  }

  const sectionRatingsHtml =
    `<strong class="rating-great">◎</strong>${sectionGreat}、` +
    `○${sectionGood}、` +
    `△${sectionFair}、` +
    `<strong class="rating-bad">×</strong>${sectionBad}`;

  rowsHtml += `
    <tr class="total-row">
      <td>計</td>
      <td>${sectionTotalScore}<span class="putt-count">(${sectionTotalPutts})</span></td>
      <td class="col-ratings total-ratings">${sectionRatingsHtml}</td>
    </tr>
  `;

  container.innerHTML = rowsHtml;
}

// データ全消去イベント
document.getElementById("clearDataBtn").onclick = () => {
  if (confirm("全てのスコアデータを消去しますか？")) {
    localStorage.removeItem("golfScoreDemo");
    renderSummary();
  }
};

// スクロールおよび拡大縮小（ピンチズーム・ダブルタップ）禁止
document.addEventListener('touchmove', (e) => {
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('gesturestart', (e) => {
  e.preventDefault();
});

renderSummary();
</script>
</body>
</html>
