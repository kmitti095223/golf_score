<!DOCTYPE html>
<!--
    スコア入力画面 (golf_score.html)
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>スコア入力</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    background: #f3f6f4; color: #17352a;
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
  }
  button, input, select { font: inherit; font-size: 18px; }
  
  .app {
    max-width: 520px; height: 100vh; height: 100dvh;
    margin: auto; background: #fff;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    flex-shrink: 0; background: #087a50; color: white; padding: 10px 14px;
    box-shadow: 0 2px 8px #0002;
  }
  header .top { 
    display: flex; align-items: center; justify-content: space-between; 
  }
  header h1 { margin: 0; font-size: 18px; font-weight: bold; }
  
  .nav-link {
    color: white; background: rgba(255, 255, 255, 0.2);
    text-decoration: none; font-size: 14px; font-weight: 700;
    padding: 6px 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.5);
  }

  .content { 
    flex: 1; display: flex; flex-direction: column; padding: 6px 8px; overflow: hidden;
  }

  .date-bar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 4px 2px 8px; color: #586c63; font-size: 13px; font-weight: bold;
  }
  .date-bar select { min-width: 0; flex: 1; height: 38px; padding: 0 8px; border: 1px solid #d8e5df; border-radius: 6px; background: #fff; color: #17352a; }
  .date-manage { color: #087a50; font-size: 13px; white-space: nowrap; }
  
  .round-info {
    flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; margin-bottom: 6px;
  }
  .stat {
    background: #f0f7f4; border-radius: 8px; padding: 6px 2px; text-align: center;
    display: flex; flex-direction: column; justify-content: center;
  }
  .stat small { display: block; color: #586c63; font-size: 11px; font-weight: bold; }
  .stat strong { display: block; margin-top: 1px; font-size: 24px; font-weight: 800; line-height: 1.1; }
  .stat .score-mark { font-size: 24px; }
  .score-under { color: #d32f2f; }
  .quick-register-btn {
    width: 52px; min-height: 54px; padding: 4px 3px; border: 1px solid #087a50;
    border-radius: 6px; background: #087a50; color: #fff; font-size: 13px; font-weight: bold;
    line-height: 1.2; cursor: pointer;
  }
  .quick-register-btn:disabled { opacity: 0.45; cursor: default; }
  .shot-actions { display: flex; align-items: stretch; gap: 4px; }

  .stat.highlight {
    background: #087a50; color: #ffffff;
    box-shadow: 0 2px 6px rgba(8, 122, 80, 0.3);
  }
  .stat.highlight small { color: #d1f2e4; font-weight: bold; }
  .stat.highlight strong { font-size: 28px; color: #ffffff; }

  .hole-nav {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 0 4px;
  }
  .navbtn {
    width: 38px; height: 38px; border: 0; border-radius: 50%;
    background: #edf4f1; color: #087a50; font-size: 22px; font-weight: bold; cursor: pointer;
  }
  .hole-title { text-align: center; }
  .hole-title strong {
    display: inline-block; min-width: 92px; padding: 4px 18px; border-radius: 8px;
    background: #087a50; color: #fff; font-size: 28px; font-weight: 800; line-height: 1.1;
  }
  .hole-title span { margin-left: 8px; color: #586c63; font-size: 15px; font-weight: bold; }

  .card {
    flex: 1; display: flex; flex-direction: column;
    border: 1px solid #dce8e3; border-radius: 8px; overflow: hidden;
  }
  .card-title {
    flex-shrink: 0; padding: 6px 10px; background: #f5f9f7;
    font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; color: #3a4a43;
  }

  #shots {
    flex: 1; display: flex; flex-direction: column; justify-content: space-between;
  }

  .shot {
    flex: 1; display: flex; align-items: center; gap: 8px;
    padding: 2px 8px; border-top: 1px solid #e9efec;
  }
  .shot-head {
    display: flex; align-items: center; gap: 6px; min-width: 75px; flex-shrink: 0;
  }
  .shot-number {
    width: 22px; height: 22px; border-radius: 50%;
    background: #e7f4ef; color: #087a50;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .shot-title { font-weight: bold; font-size: 14px; color: #17352a; }

  .shot-inputs {
    display: flex; gap: 8px; flex: 1; min-width: 0; height: 100%; align-items: center;
  }
  .shot-location {
    flex: 0 0 78px; color: #586c63; font-size: 9px; line-height: 1.3;
    text-align: right; white-space: nowrap;
  }
  .shot-location span { display: block; }
  .shot-location:empty { min-height: 1px; }
  .popup-bunker-row {
    flex-shrink: 0; padding: 6px 0; color: #17352a; font-size: 14px; font-weight: bold;
  }
  .popup-bunker-row { display: flex; gap: 18px; }
  .popup-bunker-row label {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border: 1px solid #d8e5df; border-radius: 6px; color: #586c63;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .popup-bunker-row label.checked { background: #e7f4ef; border-color: #087a50; color: #087a50; }
  .popup-bunker-row input { width: 20px; height: 20px; margin: 0; accent-color: #087a50; }

  .select-button {
    flex: 1; height: 90%; display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 1.5px solid #d8e5df; border-radius: 6px; padding: 0 10px;
    cursor: pointer; transition: background-color 0.15s, border-color 0.15s;
  }
  .club-select { flex: 1.5; }
  .rating-select { flex: 1; }
  .select-button .value { font-weight: bold; color: #889990; font-size: 15px; }
  .select-button .arrow { color: #a0b2aa; font-size: 12px; margin-left: 2px; }

  .select-button.filled {
    background: #e7f4ef; border-color: #087a50;
  }
  .select-button.filled .value { color: #087a50; font-weight: 800; font-size: 16px; }
  .select-button.filled .arrow { color: #087a50; }

  .popup-backdrop {
    position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .popup-backdrop.show { display: flex; }
  .popup {
    background: #fff; width: 100%; max-width: 520px; border-radius: 16px 16px 0 0;
    padding: 8px 10px; max-height: 94vh; max-height: 94dvh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .popup-head {
    display: flex; align-items: center; margin-bottom: 2px; flex-shrink: 0;
  }
  .popup-title { font-size: 18px; font-weight: bold; }
  .popup-actions {
    display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 6px;
    flex-shrink: 0; padding-top: 6px; margin-top: 4px; border-top: 1px solid #e9efec;
  }
  .popup-clear {
    border: 1px solid #d32f2f; border-radius: 6px; background: #fff;
    color: #d32f2f; padding: 4px 6px; font-size: 12px; font-weight: bold; cursor: pointer;
  }
  .popup-close {
    border: 0; border-radius: 6px; background: #087a50; color: #fff;
    min-width: 108px; min-height: 44px; padding: 8px 20px;
    font-size: 16px; cursor: pointer; font-weight: bold;
  }
  .popup-force-location {
    grid-column: 1 / -1; min-height: 44px; border: 1.5px solid #087a50;
    border-radius: 6px; background: #e7f4ef; color: #087a50;
    font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .popup-section-title { margin: 7px 0 4px; color: #3a4a43; font-size: 13px; }
  .popup-section-title:first-child { margin-top: 0; }
  .popup-step {
    font-size: 10px; color: #586c63; font-weight: bold; margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .popup-step-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #dce8e3; display: inline-block;
  }
  .popup-step-dot.active { background: #087a50; }
  .popup-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  #popupOptions { display: block; flex: 1; min-height: 0; overflow-y: auto; }
  .popup-option {
    padding: 5px 4px; border: 1.5px solid #d8e5df; border-radius: 7px;
    background: #fff; font-weight: bold; cursor: pointer; text-align: center; font-size: 15px; line-height: 1.1;
  }
  .popup-option.selected { background: #087a50; color: #fff; border-color: #087a50; }
  .rating-option small { display: block; font-size: 11px; font-weight: normal; color: #555; margin-top: 2px; }
  .popup-option.selected small { color: #eee; }

  @media (min-width: 700px) {
    body { padding: 12px; }
    .app { height: calc(100vh - 24px); border-radius: 14px; box-shadow: 0 8px 35px #0001; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="top">
      <h1>ゴルフスコア入力</h1>
      <div>
        <a href="summary.html" class="nav-link">スコア一覧 ❯</a>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="date-bar">
      <label for="dateSelect">プレー日</label>
      <select id="dateSelect" aria-label="プレー日"></select>
      <a class="date-manage" href="dates.html">日付管理</a>
    </div>
    <div class="hole-nav">
      <button class="navbtn" id="prevHole">‹</button>
      <div class="hole-title"><strong id="holeLabel">1H</strong></div>
      <button class="navbtn" id="nextHole">›</button>
    </div>

    <div class="round-info">
      <div class="stat"><small>Par</small><strong id="currentPar">4</strong></div>
      <div class="stat"><small>スコア</small><strong id="holeScore">0(0)</strong></div>
      <div class="stat"><small>記号</small><strong id="currentScoreMark" class="score-mark">-</strong></div>
      <div class="shot-actions">
        <button type="button" class="quick-register-btn" id="quickRegisterBtn">簡易<br>登録</button>
        <button type="button" class="quick-register-btn" id="batchRegisterBtn">一括<br>入力</button>
      </div>
    </div>

    <section class="card">
      <div class="card-title">
        <span>ショット記録</span>
        <span id="shotCount">0打</span>
      </div>
      <div id="shots"></div>
    </section>
  </main>
</div>

<div class="popup-backdrop" id="popupBackdrop">
  <div class="popup">
    <div class="popup-head">
      <strong class="popup-title" id="popupTitle">クラブを選択</strong>
    </div>
    <div class="popup-step" id="popupStep">
      <span class="popup-step-dot active" id="stepDot1"></span>ステップ1：クラブ
      <span style="margin-left:6px"></span>
      <span class="popup-step-dot" id="stepDot2"></span>ステップ2：良否
    </div>
    <div class="popup-options" id="popupOptions"></div>
    <div class="popup-actions">
      <button class="popup-clear" id="popupClear">入力をクリア</button>
      <button class="popup-close" id="popupClose">完了</button>
      <button class="popup-force-location" id="popupForceLocation">座標を強制更新して完了</button>
    </div>
  </div>
</div>

<script src="golf_data.js"></script>
<script>
const MAX_SHOTS = 12;
const clubs = ["1W","5W","UT4","5I","6I","7I","8I","9I","PW","SW","52度","58度","CP","PT","OK","OB","ペナ","－"];
const ratings = [
  ["◎","とても良い"],["○","良い"],["△","やや悪い"],["×","悪い"],["－","未設定"]
];

const requestedHole = Number(new URLSearchParams(window.location.search).get("hole"));
let hole = Number.isInteger(requestedHole) && requestedHole >= 1 && requestedHole <= 18 ? requestedHole : 1;

function createEmptyHoleData() {
  return Array.from({ length: MAX_SHOTS }, () => ({ club: "－", rating: "－", approach: false, bunker: false }));
}

let data = Array.from({ length: 18 }, () => createEmptyHoleData());
let pars = Array.from({ length: 18 }, () => 4);
let isBatchInput = false;

function isShotEntered(shot) {
  const hasClub = shot.club !== "" && shot.club !== "－";
  const hasRating = shot.rating !== "" && shot.rating !== "－";
  return hasClub || hasRating;
}

function getHoleScore(shots) {
  return shots.filter(isShotEntered).length;
}

function getPuttScore(shots) {
  return shots.filter(shot => shot.club === "PT" && !shot.approach && !shot.bunker).length;
}

function loadPars() {
  pars = GolfData.getParSettings();
}

function getScoreMark(score, par) {
  if (score === 0) return "-";
  const difference = score - par;
  if (difference <= -1) return '<span class="score-mark score-under">○</span>';
  if (difference === 0) return '<span class="score-mark">ー</span>';
  if (difference === 1) return '<span class="score-mark">△</span>';
  if (difference === 2) return '<span class="score-mark">□</span>';
  return `<span class="score-mark">+${difference}</span>`;
}

function save() {
  GolfData.saveScores(data);
}

function captureShotLocation(shotIndex, holeIndex, shot, force = false) {
  if (isBatchInput || !navigator.geolocation || (shot.location && !force)) return;

  navigator.geolocation.getCurrentPosition(position => {
    if (isBatchInput || data[holeIndex][shotIndex] !== shot || !isShotEntered(shot)) return;
    shot.location = {
      latitude: position.coords.latitude,
      longitude: position.coords.longitude
    };
    save();
    render();
  }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
}

function render() {
  document.getElementById("holeLabel").textContent = hole + "H";
  loadPars();

  const shots = data[hole-1];
  const score = getHoleScore(shots);
  const putts = getPuttScore(shots);
  const par = pars[hole-1];

  document.getElementById("shotCount").textContent = score + "打";
  document.getElementById("holeScore").textContent = `${score}(${putts})`;
  document.getElementById("currentPar").textContent = par;
  document.getElementById("currentScoreMark").innerHTML = getScoreMark(score, par);
  document.getElementById("quickRegisterBtn").disabled = getNextShotIndex(shots) >= MAX_SHOTS;

  const area = document.getElementById("shots");
  area.innerHTML = "";

  shots.forEach((shot, index) => {
    const div = document.createElement("div");
    div.className = "shot";

    const isClubFilled = shot.club && shot.club !== "－";
    const isRatingFilled = shot.rating && shot.rating !== "－";
    const location = shot.location;
    const latitude = location ? Number(location.latitude).toFixed(6) : "";
    const longitude = location ? Number(location.longitude).toFixed(6) : "";
    const shotFlags = `${shot.approach ? "A" : ""}${shot.bunker ? "B" : ""}`;
    const displayClub = `${shot.club || "－"}${shotFlags ? `-${shotFlags}` : ""}`;

    div.innerHTML = `
      <div class="shot-head">
        <div class="shot-number">${index + 1}</div>
        <div class="shot-title">第${index + 1}打</div>
      </div>

      <div class="shot-inputs">
        <button class="select-button club-select ${isClubFilled ? 'filled' : ''}" data-shot="${index}">
          <span class="value">${displayClub}</span>
          <span class="arrow">›</span>
        </button>

        <button class="select-button rating-select ${isRatingFilled ? 'filled' : ''}" data-shot="${index}">
          <span class="value">${shot.rating || "－"}</span>
          <span class="arrow">›</span>
        </button>
      </div>

      <div class="shot-location" aria-label="GPS座標">${location ? `<span>${latitude}</span><span>${longitude}</span>` : ""}</div>
    `;
    area.appendChild(div);
  });

  document.querySelectorAll(".club-select").forEach(btn => {
    btn.onclick = () => openPopup(Number(btn.dataset.shot));
  });

  document.querySelectorAll(".rating-select").forEach(btn => {
    btn.onclick = () => openPopup(Number(btn.dataset.shot));
  });
}

let popupShotIndex = -1;
let popupClubSelection = "－";

function getNextShotIndex(shots) {
  const lastEnteredShotIndex = shots.reduce((lastIndex, shot, index) => isShotEntered(shot) ? index : lastIndex, -1);
  return lastEnteredShotIndex + 1;
}

function getDefaultClub(par, shotIndex) {
  const shotNumber = shotIndex + 1;
  if (par === 3) return shotNumber === 1 ? "UT4" : shotNumber === 2 ? "CP" : "PT";
  if (par === 4) return shotNumber === 1 ? "1W" : shotNumber === 2 ? "UT4" : shotNumber === 3 ? "CP" : "PT";
  if (par === 5) return shotNumber === 1 ? "1W" : shotNumber <= 3 ? "UT4" : shotNumber === 4 ? "CP" : "PT";
  return "－";
}

function quickRegisterShot() {
  const holeIndex = hole - 1;
  const shotIndex = getNextShotIndex(data[holeIndex]);
  if (shotIndex >= MAX_SHOTS) return;

  loadPars();
  const defaultClub = getDefaultClub(pars[holeIndex], shotIndex);
  const shot = {
    club: defaultClub === "－" ? "1W" : defaultClub,
    rating: "－",
    approach: false,
    bunker: false
  };
  data[holeIndex][shotIndex] = shot;
  save();
  render();
  captureShotLocation(shotIndex, holeIndex, shot);
}

function openPopup(shotIndex) {
  popupShotIndex = shotIndex;
  loadPars();
  const shot = data[hole-1][shotIndex];
  const savedClub = shot.club;
  popupClubSelection = savedClub && savedClub !== "－" ? savedClub : getDefaultClub(pars[hole-1], shotIndex);
  if (popupClubSelection === "CP" && !shot.approach) {
    shot.approach = true;
    save();
  }

  document.getElementById("popupTitle").textContent = "クラブと良否を選択";
  document.getElementById("popupClose").textContent = isBatchInput ? "一括入力終了" : "完了";
  document.getElementById("popupForceLocation").style.display = isBatchInput ? "none" : "";
  renderPopupOptions();
  document.getElementById("popupBackdrop").classList.add("show");
}


document.getElementById("quickRegisterBtn").onclick = quickRegisterShot;
document.getElementById("batchRegisterBtn").onclick = () => {
  data[hole-1] = createEmptyHoleData();
  save();
  render();
  isBatchInput = true;
  openPopup(0);
};

function endBatchInput() {
  closePopup();
  isBatchInput = false;
}

function advanceBatchInput() {
  const nextShotIndex = getNextShotIndex(data[hole-1]);
  if (nextShotIndex >= MAX_SHOTS) {
    endBatchInput();
    return;
  }
  closePopup();
  openPopup(nextShotIndex);
}

function renderPopupOptions() {
  const options = document.getElementById("popupOptions");
  const shot = data[hole-1][popupShotIndex];
  options.innerHTML = "<div class=\"popup-section-title\">クラブ</div><div class=\"popup-options club-options\"></div><div class=\"popup-bunker-row\"><label><input type=\"checkbox\" id=\"popupApproachCheck\">アプローチ</label><label><input type=\"checkbox\" id=\"popupBunkerCheck\">バンカー</label></div><div class=\"popup-section-title\">良否</div><div class=\"popup-options rating-options\"></div>";
  const approachCheck = options.querySelector("#popupApproachCheck");
  const bunkerCheck = options.querySelector("#popupBunkerCheck");
  approachCheck.checked = shot.approach === true;
  bunkerCheck.checked = shot.bunker === true;
  approachCheck.parentElement.classList.toggle("checked", approachCheck.checked);
  bunkerCheck.parentElement.classList.toggle("checked", bunkerCheck.checked);
  approachCheck.onchange = () => {
    shot.approach = approachCheck.checked;
    approachCheck.parentElement.classList.toggle("checked", approachCheck.checked);
    save();
    render();
  };
  bunkerCheck.onchange = () => {
    shot.bunker = bunkerCheck.checked;
    bunkerCheck.parentElement.classList.toggle("checked", bunkerCheck.checked);
    save();
    render();
  };

  const clubOptions = options.querySelector(".club-options");
  clubs.forEach(club => {
    const button = document.createElement("button");
    button.className = "popup-option" + (popupClubSelection === club ? " selected" : "");
    button.textContent = club;
    button.onclick = () => {
      const holeIndex = hole - 1;
      const shot = data[holeIndex][popupShotIndex];
      popupClubSelection = club;
      shot.club = club;
      if (club === "58度" || club === "CP") shot.approach = true;
      save();
      renderPopupOptions();
      render();
      document.getElementById("popupBackdrop").classList.add("show");
    };
    clubOptions.appendChild(button);
  });

  const ratingOptions = options.querySelector(".rating-options");
  ratings.forEach(([rating, description]) => {
    const button = document.createElement("button");
    button.className = "popup-option rating-option" + (shot.rating === rating ? " selected" : "");
    button.innerHTML = `${rating}<small>${description}</small>`;
    button.onclick = () => {
      const holeIndex = hole - 1;
      const shot = data[holeIndex][popupShotIndex];
      if (!shot.club || shot.club === "－") shot.club = popupClubSelection;
      shot.rating = rating;
      save();
      render();
      if (isBatchInput) advanceBatchInput();
      else closePopup();
    };
    ratingOptions.appendChild(button);
  });
}

function closePopup(forceLocationUpdate = false) {
  if (popupShotIndex >= 0) {
    const holeIndex = hole - 1;
    const shot = data[holeIndex][popupShotIndex];
    if (!isBatchInput && isShotEntered(shot)) captureShotLocation(popupShotIndex, holeIndex, shot, forceLocationUpdate);
  }
  document.getElementById("popupBackdrop").classList.remove("show");
  popupShotIndex = -1;
  popupClubSelection = "－";
}

function nextHole() {
  if (hole < 18) { 
    save();
    hole++; 
    render(); 
  }
}
function prevHole() {
  if (hole > 1) { 
    save();
    hole--; 
    render(); 
  }
}

document.getElementById("nextHole").onclick = nextHole;
document.getElementById("prevHole").onclick = prevHole;

document.getElementById("popupClose").onclick = () => {
  if (isBatchInput) endBatchInput();
  else closePopup();
};
document.getElementById("popupForceLocation").onclick = () => closePopup(true);
document.getElementById("popupClear").onclick = () => {
  if (popupShotIndex < 0) return;
  data[hole-1][popupShotIndex] = { club: "－", rating: "－", approach: false, bunker: false };
  save();
  render();
  if (isBatchInput) endBatchInput();
  else closePopup();
};
document.getElementById("popupBackdrop").onclick = (e) => {
  if (e.target.id === "popupBackdrop") {
    if (isBatchInput) endBatchInput();
    else closePopup();
  }
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (isBatchInput) endBatchInput();
    else closePopup();
  }
});

document.addEventListener('touchmove', (e) => {
  if (!e.target.closest('.popup')) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

window.addEventListener("pagehide", save);

function loadSelectedScores() {
  const round = GolfData.getRound();
  if (!round || !Array.isArray(round.data) || round.data.length !== 18) return;
  data = round.data.map(holeShots => {
    const filled = createEmptyHoleData();
    holeShots.slice(0, MAX_SHOTS).forEach((shot, i) => {
      filled[i] = {
        club: shot.club || "－",
        rating: shot.rating || "－",
        approach: shot.approach === true,
        bunker: shot.bunker === true,
        ...(shot.location ? { location: shot.location } : {})
      };
    });
    return filled;
  });
}

function renderDateSelect() {
  const selectedDate = GolfData.getSelectedDate();
  const select = document.getElementById("dateSelect");
  select.innerHTML = GolfData.getRounds().map(round =>
    `<option value="${round.date}">${round.date}${round.courseName ? ` - ${GolfData.escapeHtml(round.courseName)}` : ""}</option>`
  ).join("");
  select.value = selectedDate;
}

document.getElementById("dateSelect").onchange = event => {
  save();
  GolfData.setSelectedDate(event.target.value);
  loadSelectedScores();
  render();
};

// URLパラメータ ?hole=N でホールを指定
const params = new URLSearchParams(window.location.search);
const paramHole = parseInt(params.get("hole"), 10);
if (!isNaN(paramHole) && paramHole >= 1 && paramHole <= 18) {
  hole = paramHole;
}

GolfData.ready.then(() => {
  loadSelectedScores();
  renderDateSelect();
  render();
});
</script>
</body>
</html>
